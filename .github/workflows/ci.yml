name: CI

# Pull requests run CI only while they carry the "ci" label: leave it off
# during review rounds and add it once the reviews pass. Pushes to main and
# manual runs always run. Jobs then run only for the parts of the tree that
# changed (the "changes" job).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Adding some other label starts a run that does nothing; give it its own
  # group so it cannot cancel a run in progress.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
    github.event.action == 'labeled' && github.event.label.name != 'ci' && github.run_id || 'ci' }}
  cancel-in-progress: true

jobs:
  # Make this check required: a job skipped by its "if" counts as passed,
  # so without it an unlabelled pull request shows green while nothing ran.
  ci-label:
    name: ci-label
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the ci label on pull requests
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'ci')
        run: |
          echo "::error::Add the ci label once the reviews pass; CI has not run on this pull request."
          exit 1

  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    outputs:
      firmware: ${{ steps.scope.outputs.firmware }}
      app: ${{ steps.scope.outputs.app }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Firmware builds read scripts/ (CI helpers, the QR default-URL
      # generator); the app reads scripts/app/. Workflow changes run all.
      - name: Scope the jobs to the changed paths
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "firmware=true" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE...$HEAD")"
          printf '%s\n' "$files"
          firmware=false
          app=false
          if printf '%s\n' "$files" | grep -qE '^(firmware/|scripts/|\.github/workflows/)'; then
            firmware=true
          fi
          if printf '%s\n' "$files" | grep -qE '^(app/|scripts/app/|\.github/workflows/)'; then
            app=true
          fi
          echo "firmware=$firmware" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"

  repo-lint:
    name: repo-lint
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Versions match the nRF Connect SDK v3.4.1 toolchain so local and CI
      # formatting results agree.
      - name: Install lint tools
        run: python -m pip install clang-format==21.1.8 yamllint==1.38.0

      - name: Check C/C++ formatting
        run: bash scripts/ci/check-format.sh

      - name: Lint YAML
        run: yamllint --strict .

      - name: Check repository hygiene
        run: python scripts/ci/check_hygiene.py

      - name: Test local QR configuration
        run: python scripts/qr/test_configure_default_url.py

      - name: Test app contact-link build defines
        run: python scripts/app/test_configure_links.py

      - name: Test Pro Micro USB public-status parser
        run: python scripts/bench/test_promicro_console.py

      - name: Test NFC provisioning host protocol
        run: python scripts/nfc/test_badge_nfc.py

      - name: Test NFC RF verification logic
        run: |
          mkdir -p build/nfc-jvm
          javac --release 8 -d build/nfc-jvm \
            scripts/nfc/android/src/dev/badge/nfc/NfcProof.java \
            scripts/nfc/android/src/dev/badge/nfc/VerificationFlow.java \
            scripts/nfc/android/tests/NfcProofTest.java \
            scripts/nfc/android/tests/VerificationFlowTest.java
          java -cp build/nfc-jvm NfcProofTest
          java -cp build/nfc-jvm VerificationFlowTest

      - name: Compile Android NFC helper
        run: |
          mkdir -p build/nfc-android
          javac --release 8 -classpath "${ANDROID_HOME}/platforms/android-35/android.jar" \
            -d build/nfc-android scripts/nfc/android/src/dev/badge/nfc/*.java

  firmware-build:
    name: firmware-build
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROTOTYPE_CONFIGS: ${{ github.workspace }}/smart-led-badge/firmware/nrf5340_prototype/configs
      REVA_CONFIGS: ${{ github.workspace }}/smart-led-badge/firmware/rev_a_nrf52840/configs
    container:
      # Official nRF Connect SDK v3.4.1 toolchain image, pinned by digest.
      # Keep in sync with scripts/dev.ps1.
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.1@sha256:45b97cad97a9967c52d77d1d1a0f7dd8fe027edd17c05c3eda2eeadc23729418
    defaults:
      run:
        # bash is required to load the toolchain environment in this image.
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: smart-led-badge

      - name: Restore nRF Connect SDK workspace cache
        uses: actions/cache@v6
        with:
          path: ncs
          key: ncs-v3.4.1-${{ hashFiles('smart-led-badge/scripts/ci/setup-ncs-workspace.sh') }}

      - name: Set up nRF Connect SDK workspace
        run: bash smart-led-badge/scripts/ci/setup-ncs-workspace.sh ncs

      - name: Build nrf5340dk/nrf5340/cpuapp
        run: |
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/ncs/zephyr"
          bash smart-led-badge/scripts/ci/build-firmware.sh

      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: firmware-nrf5340dk
          path: |
            smart-led-badge/build/nrf5340dk/merged.hex
            smart-led-badge/build/nrf5340dk/partitions.yml
            smart-led-badge/build/nrf5340dk/zephyr/.config
            smart-led-badge/build/nrf5340dk/mcuboot/zephyr/zephyr.elf
            smart-led-badge/build/nrf5340dk/mcuboot/zephyr/.config
            smart-led-badge/build/nrf5340dk/nrf5340_prototype/zephyr/zephyr.elf
            smart-led-badge/build/nrf5340dk/nrf5340_prototype/zephyr/zephyr.signed.hex
            smart-led-badge/build/nrf5340dk/nrf5340_prototype/zephyr/zephyr.map
            smart-led-badge/build/nrf5340dk/nrf5340_prototype/zephyr/.config
          # Needed for .config; only the paths listed above are uploaded.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Build matrix timing bench test for nrf5340dk/nrf5340/cpuapp
        run: |
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/ncs/zephyr"
          APP_DIR="${GITHUB_WORKSPACE}/smart-led-badge/firmware/nrf5340_prototype/bench/matrix_timing" \
            BUILD_DIR="${GITHUB_WORKSPACE}/smart-led-badge/build/matrix_timing" \
            bash smart-led-badge/scripts/ci/build-firmware.sh

      - name: Build QR screening for nrf5340dk/nrf5340/cpuapp
        run: |
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/ncs/zephyr"
          BUILD_DIR="${GITHUB_WORKSPACE}/smart-led-badge/build/qr" \
            EXTRA_CONF_FILE="${PROTOTYPE_CONFIGS}/qr-screening.conf" \
            bash smart-led-badge/scripts/ci/build-firmware.sh

      - name: Build prototype with optional bring-up checks
        run: |
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/ncs/zephyr"
          BUILD_DIR="${GITHUB_WORKSPACE}/smart-led-badge/build/prototype-debug" \
            EXTRA_CONF_FILE="${PROTOTYPE_CONFIGS}/prototype-debug.conf" \
            bash smart-led-badge/scripts/ci/build-firmware.sh

      - name: Build microphone level and FFT bench
        run: |
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/ncs/zephyr"
          BUILD_DIR="${GITHUB_WORKSPACE}/smart-led-badge/build/audio-screening" \
            EXTRA_CONF_FILE="${PROTOTYPE_CONFIGS}/audio-screening.conf" \
            bash smart-led-badge/scripts/ci/build-firmware.sh

      - name: Build watchdog reset-loop bench configuration
        run: |
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/ncs/zephyr"
          BUILD_DIR="${GITHUB_WORKSPACE}/smart-led-badge/build/watchdog-loop" \
            EXTRA_CONF_FILE="${PROTOTYPE_CONFIGS}/watchdog-loop.conf" \
            bash smart-led-badge/scripts/ci/build-firmware.sh

      - name: Build explicit NFC provisioning commands
        run: |
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/ncs/zephyr"
          BUILD_DIR="${GITHUB_WORKSPACE}/smart-led-badge/build/nfc-provisioning" \
            EXTRA_CONF_FILE="${PROTOTYPE_CONFIGS}/nfc-provisioning.conf" \
            bash smart-led-badge/scripts/ci/build-firmware.sh

      - name: Build prototype BLE with network-core radio
        run: |
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/ncs/zephyr"
          BUILD_DIR="${GITHUB_WORKSPACE}/smart-led-badge/build/ble" \
            SB_EXTRA_CONF_FILE="${PROTOTYPE_CONFIGS}/ble-sysbuild.conf" \
            bash smart-led-badge/scripts/ci/build-firmware.sh

      - name: Build P3 recording bench with network-core radio
        run: |
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/ncs/zephyr"
          BUILD_DIR="${GITHUB_WORKSPACE}/smart-led-badge/build/audio-recording" \
            SB_EXTRA_CONF_FILE="${PROTOTYPE_CONFIGS}/ble-sysbuild.conf" \
            EXTRA_CONF_FILE="${PROTOTYPE_CONFIGS}/audio-recording-bench.conf" \
            bash smart-led-badge/scripts/ci/build-firmware.sh

      - name: Build Rev A nRF52840 safe bring-up image
        run: |
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/ncs/zephyr"
          APP_DIR="${GITHUB_WORKSPACE}/smart-led-badge/firmware/rev_a_nrf52840" \
            BOARD=pixel_badge_reva/nrf52840 \
            BUILD_DIR="${GITHUB_WORKSPACE}/smart-led-badge/build/rev_a_nrf52840" \
            bash smart-led-badge/scripts/ci/build-firmware.sh

      - name: Check compiled Rev A pin and flash contract
        run: |
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/ncs/zephyr"
          python smart-led-badge/scripts/ci/check_reva_contract.py \
            --build-dir smart-led-badge/build/rev_a_nrf52840 --self-test

      - name: Build Rev A matrix and recording path
        run: |
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/ncs/zephyr"
          APP_DIR="${GITHUB_WORKSPACE}/smart-led-badge/firmware/rev_a_nrf52840" \
            BOARD=pixel_badge_reva/nrf52840 \
            BUILD_DIR="${GITHUB_WORKSPACE}/smart-led-badge/build/rev_a_recording" \
            EXTRA_CONF_FILE="${REVA_CONFIGS}/recording-bench.conf;${REVA_CONFIGS}/matrix-bench.conf" \
            bash smart-led-badge/scripts/ci/build-firmware.sh

      - name: Build Rev A peripheral diagnostics
        run: |
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/ncs/zephyr"
          APP_DIR="${GITHUB_WORKSPACE}/smart-led-badge/firmware/rev_a_nrf52840" \
            BOARD=pixel_badge_reva/nrf52840 \
            BUILD_DIR="${GITHUB_WORKSPACE}/smart-led-badge/build/reva-diagnostics" \
            EXTRA_CONF_FILE="${REVA_CONFIGS}/diagnostics.conf" \
            bash smart-led-badge/scripts/ci/build-firmware.sh

      - name: Build Pro Micro headless BLE bench
        run: |
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/ncs/zephyr"
          APP_DIR="${GITHUB_WORKSPACE}/smart-led-badge/firmware/bench/promicro_nrf52840" \
            BOARD=promicro_nrf52840/nrf52840/uf2 \
            BUILD_DIR="${GITHUB_WORKSPACE}/smart-led-badge/build/promicro-bench" \
            bash smart-led-badge/scripts/ci/build-firmware.sh

      - name: Upload Pro Micro headless bench
        uses: actions/upload-artifact@v7
        with:
          name: firmware-promicro-bench
          path: |
            smart-led-badge/build/promicro-bench/promicro_nrf52840/zephyr/zephyr.uf2
            smart-led-badge/build/promicro-bench/promicro_nrf52840/zephyr/zephyr.bin
            smart-led-badge/build/promicro-bench/promicro_nrf52840/zephyr/zephyr.elf
            smart-led-badge/build/promicro-bench/promicro_nrf52840/zephyr/.config
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload Rev A port builds
        uses: actions/upload-artifact@v7
        with:
          name: firmware-rev-a-nrf52840
          path: |
            smart-led-badge/build/rev_a_nrf52840/merged.hex
            smart-led-badge/build/rev_a_nrf52840/partitions.yml
            smart-led-badge/build/rev_a_nrf52840/rev_a_nrf52840/zephyr/zephyr.elf
            smart-led-badge/build/rev_a_nrf52840/rev_a_nrf52840/zephyr/zephyr.map
            smart-led-badge/build/rev_a_nrf52840/rev_a_nrf52840/zephyr/.config
            smart-led-badge/build/rev_a_recording/merged.hex
            smart-led-badge/build/reva-diagnostics/merged.hex
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload prototype bench images
        uses: actions/upload-artifact@v7
        with:
          name: firmware-prototype-bench
          path: |
            smart-led-badge/build/qr/merged.hex
            smart-led-badge/build/prototype-debug/merged.hex
            smart-led-badge/build/audio-screening/merged.hex
            smart-led-badge/build/audio-recording/merged.hex
            smart-led-badge/build/audio-recording/merged_CPUNET.hex
            smart-led-badge/build/watchdog-loop/merged.hex
            smart-led-badge/build/nfc-provisioning/merged.hex
            smart-led-badge/build/nfc-provisioning/nrf5340_prototype/zephyr/zephyr.elf
            smart-led-badge/build/ble/merged.hex
            smart-led-badge/build/ble/merged_CPUNET.hex
            smart-led-badge/build/ble/domains.yaml
            smart-led-badge/build/ble/nrf5340_prototype/zephyr/zephyr.elf
          if-no-files-found: error
          retention-days: 14

      # Superseded nRF5340 custom board: retain both-core compile regression.
      # The actual E73 Rev A board is built separately above.
      - name: Build smart_led_badge/nrf5340/cpuapp
        run: |
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/ncs/zephyr"
          BOARD=smart_led_badge/nrf5340/cpuapp \
            BUILD_DIR="${GITHUB_WORKSPACE}/smart-led-badge/build/badge" \
            bash smart-led-badge/scripts/ci/build-firmware.sh

      # Same board with every peripheral driver enabled, so driver and
      # devicetree integration is compiled before the application uses it.
      - name: Build smart_led_badge/nrf5340/cpuapp with peripheral drivers
        run: |
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/ncs/zephyr"
          BOARD=smart_led_badge/nrf5340/cpuapp \
            BUILD_DIR="${GITHUB_WORKSPACE}/smart-led-badge/build/badge-periph" \
            EXTRA_CONF_FILE="${PROTOTYPE_CONFIGS}/rev-a-peripherals.conf" \
            bash smart-led-badge/scripts/ci/build-firmware.sh

      - name: Build smart_led_badge/nrf5340/cpunet
        run: |
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/ncs/zephyr"
          BOARD=smart_led_badge/nrf5340/cpunet \
            BUILD_DIR="${GITHUB_WORKSPACE}/smart-led-badge/build/badge-net" \
            bash smart-led-badge/scripts/ci/build-firmware.sh

  flutter-tests:
    name: flutter-tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.5'
          cache: true
      - name: Restore app dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze app
        run: flutter analyze
      - name: Test protocol, controller and screens
        run: flutter test
      - name: Set up Java for Android tests
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
      # AGP 8.11's library default is NDK 27; Flutter 3.38.5's app uses 28.2.
      - name: Install pinned Android SDK and NDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "build-tools;36.1.0" \
            "ndk;27.0.12077973" "ndk;28.2.13676358"
          cat "$ANDROID_HOME/ndk/27.0.12077973/source.properties"
          cat "$ANDROID_HOME/ndk/28.2.13676358/source.properties"
      # Flutter generates the ignored wrapper and local.properties on clean CI.
      - name: Prepare Android Gradle project
        run: flutter build apk --debug --config-only
      - name: Test Android storage, crypto and playback
        working-directory: app/android
        run: bash gradlew --no-daemon testDebugUnitTest
      - name: Upload Android unit-test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: |
            app/build/app/test-results/testDebugUnitTest/
            app/build/app/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  unit-tests:
    name: unit-tests
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.1@sha256:45b97cad97a9967c52d77d1d1a0f7dd8fe027edd17c05c3eda2eeadc23729418
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: smart-led-badge

      - name: Restore nRF Connect SDK workspace cache
        uses: actions/cache@v6
        with:
          path: ncs
          key: ncs-v3.4.1-${{ hashFiles('smart-led-badge/scripts/ci/setup-ncs-workspace.sh') }}

      - name: Set up nRF Connect SDK workspace
        run: bash smart-led-badge/scripts/ci/setup-ncs-workspace.sh ncs

      - name: Install host build dependencies
        run: bash smart-led-badge/scripts/ci/install-host-deps.sh

      - name: Run Twister host tests
        run: |
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/ncs/zephyr"
          bash smart-led-badge/scripts/ci/run-tests.sh

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: twister-reports
          path: |
            smart-led-badge/build/twister/twister.json
            smart-led-badge/build/twister/twister.xml
            smart-led-badge/build/twister/twister_report.xml
          if-no-files-found: warn
          retention-days: 14
