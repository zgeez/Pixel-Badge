name: Feature / engineering task
description: New capability, refactor, tooling, or other planned engineering work.
labels: [task]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will completion be verified (build, test, measurement)?
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Firmware
        - Hardware
        - Tooling / CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / references
      description: Constraints, open questions, datasheet or documentation links.
