name: Bug
description: Firmware, tooling, or documentation behaves incorrectly.
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Firmware commit / version
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target
      description: Board and revision (for example nRF5340 DK, Rev A badge), or host/CI.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: RTT/UART log output or CI log excerpt.
      render: text
