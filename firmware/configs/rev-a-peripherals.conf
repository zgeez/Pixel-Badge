#
# Compile check for the Rev A board: enables the drivers for every peripheral
# the board devicetree describes, so CI builds them against the board nodes
# before the application uses them. Not a product configuration.

CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_WATCHDOG=y
CONFIG_INPUT=y
CONFIG_LED=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_SENSOR=y
CONFIG_USB_DEVICE_STACK_NEXT=y
