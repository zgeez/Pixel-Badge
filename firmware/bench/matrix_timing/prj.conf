# SPDX-License-Identifier: MIT

# Logging over SEGGER RTT; the DK's UARTs stay unused (see docs/firmware.md).
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# GPIO driver owns GPIOTE; the test allocates its channels from it.
CONFIG_GPIO=y
# DPPI connections between TIMER, SPIM and GPIOTE.
CONFIG_NRFX_GPPI=y
# TIMER1, TIMER2 and SPIM4 are driven directly through the nrfx HAL, so the
# Zephyr SPI driver stays off.
CONFIG_SPI=n
