# SPDX-License-Identifier: MIT
description: Rev A TLC59283 columns and active-low HC595 row chain
compatible: "smartledbadge,reva-matrix"
include: display-controller.yaml
properties:
  spi:
    type: phandle
    required: true
    description: Zephyr SPIM3 bus for the diagnostics chain readback; released before the scan drives its pins
  timer:
    type: phandle
    required: true
    description: Slot TIMER3 sequencing SPI start, LAT and BLANK through PPI; not owned by the Bluetooth controller
  lat-gpios:
    type: phandle-array
    required: true
  blank-gpios:
    type: phandle-array
    required: true
  arm-gpios:
    type: phandle-array
    required: true
  safe-gpios:
    type: phandle-array
    required: true
  enable-gpios:
    type: phandle-array
    required: true
  scan-spim:
    type: phandle
    required: true
    description: SPIM instance driven by PPI for the scan (SPIM2; not owned by a Zephyr driver)
  plane-timer:
    type: phandle
    required: true
    description: Counter TIMER that stops the slot timer after each plane
  sck-gpios:
    type: phandle-array
    required: true
    description: Matrix SCK pin, shared with the readback SPI's pinctrl
  mosi-gpios:
    type: phandle-array
    required: true
    description: Matrix MOSI pin, shared with the readback SPI's pinctrl
