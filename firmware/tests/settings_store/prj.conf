# SPDX-License-Identifier: MIT
CONFIG_ZTEST=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_SIMULATOR_CALLBACKS=y
# Keep simulated flash in RAM; remounting NVS still preserves its bytes.
# This avoids relying on file mmap support on Windows Docker bind mounts.
CONFIG_NATIVE_EXTRA_CMDLINE_ARGS="--flash_in_ram"
CONFIG_NVS=y
CONFIG_NVS_DATA_CRC=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_NVS_SECTOR_COUNT=8

# Bounded Studio assets and settings copies in portable regression tests.
CONFIG_ZTEST_STACK_SIZE=131072
