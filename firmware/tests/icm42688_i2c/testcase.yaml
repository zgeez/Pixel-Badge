# SPDX-License-Identifier: MIT
#
# ICM-42688-P I2C driver against a register-level emulator. Proves the driver
# logic (bus access, bank selection, reset/identity checks, I2C-mode
# configuration and order, power-mode/ODR validation, invalid samples,
# conversions, data-ready path), not the real part.

tests:
  drivers.icm42688_i2c:
    tags: drivers sensor
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
