# SPDX-License-Identifier: MIT

# C++17 application code. Exceptions and RTTI are disabled by project policy
# (see docs/firmware.md). They are unavailable with Zephyr's minimal C++
# library; the explicit assignments keep them off if a full C++ library is
# selected later.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Development logging over SEGGER RTT.
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# Static application frames and QR/settings validation use bounded stack buffers.
CONFIG_MAIN_STACK_SIZE=16384

# SPDX-License-Identifier: MIT
CONFIG_APP_AUDIO=y
CONFIG_APP_AUDIO_CHANNEL=0
CONFIG_DEBUG_COREDUMP=n
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=4
CONFIG_BT_CONN_TX_MAX=4
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_AUDIO_DMIC_LOG_LEVEL_OFF=y

# One nRF52840 core owns application and Bluetooth controller.
CONFIG_DISPLAY=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_APP_PROTOTYPE=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_SMP_ENFORCE_MITM=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_APP_BLE=y
CONFIG_BT_DEVICE_NAME="Smart LED Badge"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_REVA_MATRIX_OUTPUT=n
# Low-battery System OFF (APP_POWER_STATES).
CONFIG_POWEROFF=y
# USB device (APP_USB_DEVICE): host configuration enables the 500 mA SDP
# input limit. The CDC ACM interface is inert; no console or shell uses it.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SERIAL=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
