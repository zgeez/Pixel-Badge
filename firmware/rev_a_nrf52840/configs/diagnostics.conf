# Single-owner peripheral checks; no BLE/settings loop or recording.
CONFIG_APP_PROTOTYPE=n
CONFIG_APP_BLE=n
CONFIG_BT=n
CONFIG_APP_AUDIO=n
CONFIG_APP_MOTION=n
CONFIG_APP_NFC=n
CONFIG_APP_BRINGUP_CHECKS=y
# Keep the whole first boot until an RTT logger attaches (1 KiB drops the
# bring-up check results).
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
CONFIG_HWINFO=y
