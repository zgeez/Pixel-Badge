# Bench add-on: run the 32.768 kHz clock from the internal RC oscillator
# instead of the Y401 crystal, for a board whose crystal does not oscillate
# correctly. The RC is calibrated against the HFXO. Selecting it leaves the
# declared accuracy at the crystal's 20 ppm, so Bluetooth sleep-clock timing
# is told 500 ppm here. Not for the product image.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
