# Add to diagnostics.conf for the staged matrix bench (docs/bringup.md).
# Current-limited bench supply only; not battery/wearable acceptance.
CONFIG_REVA_MATRIX_OUTPUT=y
CONFIG_APP_MATRIX_BENCH=y
# The bench supply's current limit protects this step; it may run without a
# pack, so battery load shedding is off.
CONFIG_APP_LOAD_SHED=n
