# SPDX-License-Identifier: MIT

# HUB75 bench panel (zephyr,display in the DK overlay).
CONFIG_DISPLAY=y

# Module checks: IMU (I2C, sensor API), NFC tag (raw I2C), PDM microphone.
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# P3 crypto primitives (the service is enabled only with the BLE prototype).
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
# Keep both ends of IPC able to carry the negotiated audio ATT payload.
